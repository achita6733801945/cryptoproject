pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html public/ || true
    - cp -r style.css public/ || true
    - cp -r script.js public/ || true
    - cp -r send.html public/ || true
    - cp -r history.html public/ || true
  artifacts:
    paths:
      - public
  only:
    - main