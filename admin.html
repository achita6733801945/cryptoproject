<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DevOps Panel</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.box {
    background: #1e293b;
    padding: 20px;
    margin: 20px auto;
    width: 400px;
    border-radius: 10px;
}

input, button {
    margin: 5px;
    padding: 10px;
    width: 90%;
    border-radius: 5px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

#status {
    margin-top: 10px;
    font-size: 16px;
}

.success { color: lightgreen; }
.fail { color: red; }
.loading { color: yellow; }

.loader {
  border: 5px solid #334155;
  border-top: 5px solid #22c55e;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
  display: none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<h1>🚀 DevOps Panel</h1>

<!-- 🔐 LOGIN -->
<div id="loginBox" class="box">
    <h3>Login</h3>
    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
</div>

<!-- 🚀 ADMIN -->
<div id="adminBox" class="box" style="display:none;">
    <h3>Deploy</h3>

    <input id="nameInput" placeholder="ชื่อคน deploy">
    <input id="msgInput" placeholder="แก้อะไร">

    <button onclick="deploy()">🚀 Deploy</button>
    <button onclick="openHistory()">📜 History</button>
    <button onclick="loadCommits()">📂 Versions</button>

    <div class="loader" id="loader"></div>

    <h3 id="status"></h3>

    <div id="commitBox"></div>
</div>

<script>
    
// 🔥 auto login check
window.onload = async () => {
    const res = await fetch('/check-login');
    const data = await res.json();

    if (data.status === 'ok') {
        loginBox.style.display = 'none';
        adminBox.style.display = 'block';
    }
}


// 🔐 LOGIN
async function login() {
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
    });

    const data = await res.json();

    if (data.status === 'success') {
        loginBox.style.display = 'none';
        adminBox.style.display = 'block';
    } else {
        alert("❌ Login failed");
    }
}


// 🚀 DEPLOY
async function deploy() {

    const name = nameInput.value;
    const msg = msgInput.value;

    if (!name || !msg) {
        alert("⚠️ กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    loader.style.display = "block";
    status.innerHTML = "<span class='loading'>⏳ Deploying...</span>";

    try {
        const res = await fetch('/deploy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, message: msg })
        });

        const data = await res.json();

        loader.style.display = "none";

        if (data.status === 'success') {
            status.innerHTML = "<span class='success'>✅ Deploy สำเร็จ</span>";
        } else {
            status.innerHTML = "<span class='fail'>❌ Deploy ล้มเหลว</span>";
        }

    } catch (err) {
        loader.style.display = "none";
        status.innerHTML = "<span class='fail'>❌ Error</span>";
    }
}


// 📂 LOAD COMMITS
async function loadCommits() {

    try {
        const res = await fetch('/commits');

        if (!res.ok) {
            commitBox.innerHTML = "❌ โหลด version ไม่ได้ (" + res.status + ")";
            return;
        }

        const data = await res.json();

        if (!data.length) {
            commitBox.innerHTML = "⚠️ ยังไม่มี commit";
            return;
        }

        let html = "<h3>📂 Versions</h3>";

        data.forEach(c => {
            html += `
            <div style="margin:10px; padding:10px; background:#0f172a;">
                🔹 ${c.hash}<br>
                👤 ${c.author}<br>
                📝 ${c.message}<br>
                ⏰ ${c.date}<br>
                <button onclick="rollback('${c.hash}')">⏪ Rollback</button>
            </div>
            `;
        });

        commitBox.innerHTML = html;

    } catch (err) {
        commitBox.innerHTML = "💥 ERROR";
        console.error(err);
    }
}


// ⏪ ROLLBACK (🔥 อัปเกรด)
async function rollback(hash) {

    if (!confirm("⚠️ ย้อนเวอร์ชันนี้จริงไหม?")) return;

    loader.style.display = "block";
    status.innerHTML = "<span class='loading'>⏳ กำลัง rollback...</span>";

    try {
        const res = await fetch('/rollback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hash })
        });

        const data = await res.json();

        loader.style.display = "none";

        if (data.status === 'success') {

            status.innerHTML = "<span class='success'>✅ rollback สำเร็จ กำลัง reload...</span>";

            // 🔥 reload หน้า + bypass cache
            setTimeout(() => {
                location.href = location.pathname + "?t=" + Date.now();
            }, 1500);

        } else {
            status.innerHTML = "<span class='fail'>❌ rollback ล้มเหลว</span>";
        }

    } catch (err) {
        loader.style.display = "none";
        status.innerHTML = "<span class='fail'>❌ Error</span>";
    }
}


// 📜 HISTORY
function openHistory() {
    window.open('/history.html', '_blank');
}

</script>

</body>
</html>
