<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DevOps Panel</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.box {
    background: #1e293b;
    padding: 20px;
    margin: 20px auto;
    width: 400px;
    border-radius: 10px;
}

input, button {
    margin: 5px;
    padding: 10px;
    width: 90%;
    border-radius: 5px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
}

.fail { color: red; }
.success { color: lightgreen; }

#historyBox {
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
}
</style>
</head>

<body>

<h1>🚀 DevOps Panel</h1>

<!-- LOGIN -->
<div id="loginBox" class="box">
    <h3>Login</h3>
    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="box" style="display:none;">
    <h3>Deploy</h3>

    <input id="name" placeholder="ชื่อคน deploy">
    <input id="msg" placeholder="แก้อะไร">

    <button onclick="deploy()">🚀 Deploy</button>
    <button onclick="loadHistory()">📜 History</button>

    <h3 id="status"></h3>

    <div id="historyBox"></div>
</div>

<script>
async function login() {
    const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: user.value,
            password: pass.value
        })
    });

    const data = await res.json();

    if (data.status === 'success') {
        loginBox.style.display = 'none';
        adminBox.style.display = 'block';
    } else {
        alert("Login failed");
    }
}

async function deploy() {
    const res = await fetch('/deploy', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: name.value,
            message: msg.value
        })
    });

    const data = await res.json();

    if (data.status === 'success') {
        status.innerHTML = "<span class='success'>✅ Deploy สำเร็จ</span>";
    } else {
        status.innerHTML = "<span class='fail'>❌ Deploy ล้มเหลว</span>";
    }

    loadHistory();
}

async function loadHistory() {
    const res = await fetch('/history');
    const data = await res.json();

    let html = "";

    data.forEach(item => {
        html += `
        <div>
            👤 ${item.name}<br>
            📝 ${item.message}<br>
            ⏰ ${item.time}<br>
            <b class="${item.status}">${item.status}</b>
            <hr>
        </div>
        `;
    });

    historyBox.innerHTML = html;
}
</script>

</body>
</html>
