<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DevOps Panel</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.box {
    background: #1e293b;
    padding: 20px;
    margin: 20px auto;
    width: 400px;
    border-radius: 10px;
}

input, button {
    margin: 5px;
    padding: 10px;
    width: 90%;
    border-radius: 5px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

#status {
    margin-top: 10px;
    font-size: 16px;
}

.success { color: lightgreen; }
.fail { color: red; }
.loading { color: yellow; }

.loader {
  border: 5px solid #334155;
  border-top: 5px solid #22c55e;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
  margin: 10px auto;
  display: none;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<h1>🚀 DevOps Panel</h1>

<!-- 🔐 LOGIN -->
<div id="loginBox" class="box">
    <h3>Login</h3>
    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
</div>

<!-- 🚀 ADMIN -->
<div id="adminBox" class="box" style="display:none;">
    <h3>Deploy</h3>

    <input id="nameInput" placeholder="ชื่อคน deploy">
    <input id="msgInput" placeholder="แก้อะไร">

    <button onclick="deploy()">🚀 Deploy</button>
    <button onclick="openHistory()">📜 History</button>

    <div class="loader" id="loader"></div>

    <h3 id="status"></h3>
</div>

<script>

// 🔐 LOGIN
async function login() {
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
    });

    const data = await res.json();

    if (data.status === 'success') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminBox').style.display = 'block';
    } else {
        alert("❌ Login failed");
    }
}


// 🚀 DEPLOY (แก้ bug แล้ว)
async function deploy() {

    const name = document.getElementById('nameInput').value;
    const msg = document.getElementById('msgInput').value;

    // ✅ เช็คข้อมูล
    if (!name || !msg) {
        alert("⚠️ กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    // 🌀 loading
    document.getElementById('loader').style.display = "block";
    document.getElementById('status').innerHTML =
        "<span class='loading'>⏳ กำลัง Deploy...</span>";

    try {
        const res = await fetch('/deploy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                message: msg
            })
        });

        const data = await res.json();

        document.getElementById('loader').style.display = "none";

        if (data.status === 'success') {
            document.getElementById('status').innerHTML =
                "<span class='success'>✅ Deploy สำเร็จ!</span>";
        } else {
            document.getElementById('status').innerHTML =
                "<span class='fail'>❌ Deploy ล้มเหลว</span>";
            console.error(data.data);
        }

    } catch (err) {
        document.getElementById('loader').style.display = "none";
        document.getElementById('status').innerHTML =
            "<span class='fail'>❌ Error</span>";
        console.error(err);
    }
}


// 📜 HISTORY
function openHistory() {
    window.open('/history.html', '_blank');
}

</script>

</body>
</html>
