<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    text-align: center;
}

input, button {
    padding: 10px;
    margin: 5px;
    border: none;
    border-radius: 6px;
}

button {
    background: #00ff99;
    cursor: pointer;
}

button:hover {
    background: #00cc77;
}

.box {
    background: #222;
    margin: 20px auto;
    padding: 20px;
    width: 80%;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1>🚀 Admin Deploy Panel</h1>

<!-- 🔐 LOGIN -->
<div class="box" id="loginBox">
    <h2>Login</h2>
    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">
    <br>
    <button onclick="login()">Login</button>
</div>

<!-- 🔒 PANEL (ซ่อนก่อน) -->
<div id="panel" style="display:none;">

    <!-- 🚀 DEPLOY -->
    <div class="box">
        <h2>Deploy</h2>
        <input id="name" placeholder="ชื่อคน deploy">
        <input id="msg" placeholder="ข้อความ commit">
        <br>
        <button onclick="deploy()">🚀 Deploy</button>
    </div>

    <!-- 📊 CONTROL -->
    <div class="box">
        <button onclick="loadHistory()">📜 History</button>
        <button onclick="loadCommits()">📂 Versions</button>
        <button onclick="logout()">🚪 Logout</button>
    </div>

    <!-- 📦 OUTPUT -->
    <div class="box" id="output"></div>

</div>


<script>

// 🔐 LOGIN
async function login() {

    const res = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: document.getElementById('user').value,
            password: document.getElementById('pass').value
        })
    });

    const data = await res.json();

    if (data.status === 'success') {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
    } else {
        alert("❌ login ไม่ถูก");
    }
}


// 🚪 LOGOUT
function logout() {
    location.reload(); // ง่ายสุด รีหน้า = เคลียร์ session ฝั่ง client
}


// 🚀 DEPLOY
async function deploy() {

    const res = await fetch('/deploy', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: document.getElementById('name').value,
            message: document.getElementById('msg').value
        })
    });

    const data = await res.json();

    document.getElementById('output').innerHTML =
        "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
}


// 📜 HISTORY
async function loadHistory() {

    const res = await fetch('/history');
    const data = await res.json();

    let html = "<h2>📜 History</h2>";

    data.forEach(h => {
        html += `
        <div>
            👤 ${h.name}<br>
            📝 ${h.message}<br>
            ⏰ ${h.time}<br>
            📊 ${h.status}
            <hr>
        </div>
        `;
    });

    document.getElementById('output').innerHTML = html;
}


// 📂 COMMITS
async function loadCommits() {

    const res = await fetch('/commits');
    const data = await res.json();

    let html = "<h2>📂 Versions</h2>";

    data.forEach(c => {
        html += `
        <div>
            🔹 ${c.hash}<br>
            👤 ${c.author}<br>
            📝 ${c.message}<br>
            ⏰ ${c.date}<br>
            <button onclick="rollback('${c.hash}')">⏪ Rollback</button>
            <hr>
        </div>
        `;
    });

    document.getElementById('output').innerHTML = html;
}


// ⏪ ROLLBACK
async function rollback(hash) {

    if (!confirm("⚠️ ย้อนเวอร์ชันจริงไหม?")) return;

    const res = await fetch('/rollback', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ hash })
    });

    const data = await res.json();

    if (data.status === 'success') {
        alert("✅ rollback สำเร็จ");
    } else {
        alert("❌ rollback ไม่สำเร็จ");
    }
}

</script>

</body>
</html>
