<!DOCTYPE html>
<html>
<head>
    <title>Admin Deploy</title>
</head>
<body>

<h2>Login</h2>
<input id="user" placeholder="username">
<input id="pass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<hr>

<h2>Deploy</h2>
<button onclick="deploy()">🚀 Deploy</button>

<pre id="log"></pre>

<script>
async function login() {
    const res = await fetch('http://localhost:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            user: document.getElementById('user').value,
            pass: document.getElementById('pass').value
        })
    });

    const data = await res.json();
    alert(data.status);
}

async function deploy() {
    document.getElementById('log').innerText = "⏳ Deploying...";

    const res = await fetch('http://localhost:3000/deploy', {
        method: 'POST'
    });

    const data = await res.json();

    if (data.status === 'success') {
        document.getElementById('log').innerText = "✅ SUCCESS\n" + data.data;
    } else {
        document.getElementById('log').innerText = "❌ ERROR\n" + data.data;
    }
}
</script>

</body>
</html>
