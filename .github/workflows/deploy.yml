name: Deploy to GitHub Pages

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Show deploy name
        run: echo "Deploy Name: ${{ github.event.client_payload.deploy_name }}"
      
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./   # โฟลเดอร์เว็บของคุณ